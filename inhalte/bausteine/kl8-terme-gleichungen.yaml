# Bausteine zu Gym Kl. 8, LB 1 „Arbeiten mit Termen und Gleichungen“.
# Felder wie in voraussetzungen-kl5-7.yaml. Zusätzlich:
#   darstellungen  welche Darstellungen sinnvoll sind (symbolisch, grafisch, tabelle, text)
#   status         entwurf | geprueft (geprueft = von Timon fachlich abgenommen)
#
# AFB-Einstufung orientiert sich an der Interpretationshilfe (ih-terme-gleichungen S. 5).
# Fachlich abgenommen von Timon am 20.11.2026.

bausteine:

  # --- Struktur von Termen -------------------------------------------------

  t8-term-struktur:
    titel: "Aufbau eines Terms erkennen"
    beschreibung: >
      Erkennen, ob ein Term insgesamt eine Summe, Differenz, ein Produkt oder ein Quotient ist,
      auch bei verknüpften Termen (z. B. Produkt aus Zahl und Summe); Term ↔ Rechenbaum.
    klasse: 8
    quelle: [lp-gy-2021 S. 20 (Kl. 8, LB 1, „Erkennen der Struktur von Termen“)]
    afb: [I, II]
    ohne_hm: true
    darstellungen: [symbolisch, grafisch]
    fehlertypen: [VR]
    voraussetzungen: [[v5-vorrang, notwendig]]
    status: geprueft

  t8-term-text:
    titel: "Terme in Worte fassen und aus Worten aufstellen"
    beschreibung: >
      Wortbeschreibung ↔ Term (z. B. „das Dreifache der Summe aus einer Zahl und 2“),
      einfache Sachsituationen durch Terme beschreiben; Bedeutung einer Variablen angeben.
    klasse: 8
    quelle: [lp-gy-2021 S. 20 (Kl. 8, LB 1, „Unterscheiden von Namen, Wert und Bedeutung einer Variablen“)]
    afb: [I, II]
    ohne_hm: true
    darstellungen: [text, symbolisch]
    fehlertypen: [TV, VR, KL]
    voraussetzungen: [[t8-term-struktur, notwendig]]
    status: geprueft

  t8-termwert:
    titel: "Werte in Terme einsetzen"
    beschreibung: "Termwerte berechnen, auch mit negativen Zahlen und Brüchen; Wertetabellen ausfüllen."
    klasse: 8
    quelle: [lp-gy-2021 S. 20 (Kl. 8, LB 1), ih-terme-gleichungen S. 5 („Termberechnung“)]
    afb: [I, II]
    ohne_hm: true
    darstellungen: [symbolisch, tabelle]
    fehlertypen: [VZ, VR, PO, BR]
    voraussetzungen:
      - [v7-rational-multiplizieren, notwendig]
      - [v7-potenz-wurzel, notwendig]
      - [v6-bruch-addieren, hilfreich]
    status: geprueft

  t8-term-gleichwertig:
    titel: "Prüfen, ob zwei Terme gleichwertig sind"
    beschreibung: "Durch Umformen oder Einsetzen prüfen; Gegenbeispiel finden; Fehler in Umformungen finden. (Keine Wertetabelle: Einsetzen kann nur Ungleichheit zeigen.)"
    klasse: 8
    quelle: [lp-gy-2021 S. 20 (Kl. 8, LB 1)]
    afb: [II, III]
    ohne_hm: true
    darstellungen: [symbolisch]
    fehlertypen: [KL, ZF, PO, VZ]
    voraussetzungen: [[t8-termwert, notwendig], [t8-ausmultiplizieren-monom, hilfreich]]
    status: geprueft

  # --- Terme umformen ------------------------------------------------------

  t8-zusammenfassen:
    titel: "Terme mit mehreren Variablen zusammenfassen"
    beschreibung: "Gleichartige Glieder mit mehreren Variablen und Potenzen zusammenfassen (Typ 19ab − 17ac − ab)."
    klasse: 8
    quelle: [lp-gy-2021 S. 20 (Kl. 8, LB 1), ih-terme-gleichungen S. 5]
    afb: [I]
    ohne_hm: true
    darstellungen: [symbolisch]
    fehlertypen: [ZF, VZ, PO]
    voraussetzungen: [[v7-term-zusammenfassen, notwendig]]
    status: geprueft

  t8-ausmultiplizieren-monom:
    titel: "Produkt mal Klammer ausmultiplizieren"
    beschreibung: >
      Ein Produkt (Zahl, Variable, Potenz) mit einer Summe multiplizieren, auch Minus vor der Klammer
      und Potenzen in der Klammer (Typ 3·(4x + 2y), 15xy·(3x + 4xy)).
    klasse: 8
    quelle: [lp-gy-2021 S. 20 (Kl. 8, LB 1), ih-terme-gleichungen S. 5]
    afb: [I, II]
    ohne_hm: true
    darstellungen: [symbolisch, grafisch]
    fehlertypen: [KL, VZ, PO]
    voraussetzungen: [[v7-zahl-mal-summe, notwendig], [t8-zusammenfassen, notwendig]]
    status: geprueft

  t8-summe-mal-summe:
    titel: "Summe mal Summe"
    beschreibung: "Zwei Summen multiplizieren und zusammenfassen (Typ (x − 3)·(x + 2)); Flächenmodell."
    klasse: 8
    quelle: [ih-terme-gleichungen S. 5 („Summe · Summe“)]
    afb: [I, II]
    ohne_hm: true
    darstellungen: [symbolisch, grafisch]
    fehlertypen: [KL, VZ, ZF, PO]
    voraussetzungen: [[t8-ausmultiplizieren-monom, notwendig]]
    status: geprueft

  t8-klammern-verschachtelt:
    titel: "Mehrere und verschachtelte Klammern auflösen"
    beschreibung: >
      Terme mit mehreren Klammern, Klammern in Klammern und anschließendem Zusammenfassen
      (Typ 15xy·(3x + 4xy) − 3x²y, a·(a − (3c + 2a))).
    klasse: 8
    quelle: [lp-gy-2021 S. 20 (Kl. 8, LB 1), ih-terme-gleichungen S. 5]
    afb: [II]
    ohne_hm: true
    darstellungen: [symbolisch]
    fehlertypen: [KL, VZ, ZF, VR]
    voraussetzungen: [[t8-ausmultiplizieren-monom, notwendig], [t8-summe-mal-summe, hilfreich]]
    status: geprueft

  t8-ausklammern:
    titel: "Ausklammern (Faktorisieren mit dem Distributivgesetz)"
    beschreibung: "Gemeinsame Faktoren ausklammern – Zahlen, Variablen und Potenzen (Typ x³ + x² = x²·(x + 1))."
    klasse: 8
    quelle: [ih-terme-gleichungen S. 5 („Faktorisieren mit Distributivgesetz, Ausklammern (auch bei Potenzen)“)]
    afb: [I, II]
    ohne_hm: true
    darstellungen: [symbolisch, grafisch]
    fehlertypen: [KL, PO, VZ]
    voraussetzungen: [[t8-ausmultiplizieren-monom, notwendig]]
    status: geprueft

  # --- Binomische Formeln --------------------------------------------------

  t8-binom-ausmultiplizieren:
    titel: "Binomische Formeln: Klammern auflösen"
    beschreibung: >
      Alle drei binomischen Formeln zum Ausmultiplizieren nutzen, auch mit Koeffizienten
      und Vorfaktor (Typ (2 − a)², (a + 2b)·(a − 2b), 2·(x − 5)²).
    klasse: 8
    quelle: [lp-gy-2021 S. 20 (Kl. 8, LB 1, „binomische Formeln“), ih-terme-gleichungen S. 5]
    afb: [I, II]
    ohne_hm: true
    darstellungen: [symbolisch, grafisch]
    fehlertypen: [PO, VZ, KL]
    voraussetzungen: [[t8-summe-mal-summe, notwendig], [v7-potenz-wurzel, notwendig]]
    status: geprueft

  t8-binom-geometrie:
    titel: "Binomische Formeln am Quadrat verstehen"
    beschreibung: "Geometrische Interpretation: Flächen eines zerlegten Quadrats/Rechtecks den Termen zuordnen."
    klasse: 8
    quelle: [lp-gy-2021 S. 20 (Kl. 8, LB 1, „geometrische Interpretation“)]
    afb: [I, II]
    ohne_hm: true
    darstellungen: [grafisch, symbolisch]
    fehlertypen: [PO, DA]
    voraussetzungen: [[t8-summe-mal-summe, notwendig]]
    status: geprueft

  t8-binom-ergaenzen:
    titel: "Binomische Formeln: Lücken ergänzen"
    beschreibung: "Fehlende Glieder ergänzen (Typ x² + ▢ + 9 = (x + ▢)²); Formel erkennen."
    klasse: 8
    quelle: [lp-gy-2021 S. 20 (Kl. 8, LB 1)]
    afb: [II]
    ohne_hm: true
    darstellungen: [symbolisch]
    fehlertypen: [PO, VZ]
    voraussetzungen: [[t8-binom-ausmultiplizieren, notwendig]]
    status: geprueft

  t8-binom-faktorisieren:
    titel: "Binomische Formeln: Faktorisieren"
    beschreibung: "Summen mit binomischen Formeln als Produkt schreiben (Typ x² − 8x + 16, a² − b²), auch nach Ausklammern."
    klasse: 8
    quelle: [ih-terme-gleichungen S. 5 („mithilfe der binomischen Formeln … Faktorisieren“)]
    afb: [II, III]
    ohne_hm: true
    darstellungen: [symbolisch]
    fehlertypen: [PO, VZ, KL]
    voraussetzungen: [[t8-binom-ergaenzen, notwendig], [t8-ausklammern, hilfreich]]
    status: geprueft

  # --- Bruchterme ----------------------------------------------------------

  t8-bruchterm-multiplizieren:
    titel: "Bruchterme multiplizieren und kürzen"
    beschreibung: "Produkte von Bruchtermen mit Produkten im Zähler/Nenner vereinfachen (Typ 3/(8x) · x²/9)."
    klasse: 8
    quelle: [ih-terme-gleichungen S. 5]
    afb: [II]
    ohne_hm: true
    darstellungen: [symbolisch]
    fehlertypen: [BR, PO]
    voraussetzungen: [[v6-bruch-multiplizieren, notwendig], [t8-zusammenfassen, hilfreich]]
    status: geprueft

  t8-bruchterm-faktorisieren-kuerzen:
    titel: "Bruchterme durch Faktorisieren kürzen"
    beschreibung: >
      Zähler/Nenner erst faktorisieren, dann kürzen (Typ (x³ + x²)/x², (a² − b²)/(a − b));
      typischer Fehler „aus Summen kürzen“. Ausgeschlossene Werte nur als Hinweis, nicht bewertet.
    klasse: 8
    quelle: [ih-terme-gleichungen S. 5 (AB III)]
    afb: [III]
    ohne_hm: true
    darstellungen: [symbolisch]
    fehlertypen: [BR, PO, KL]
    voraussetzungen:
      - [t8-ausklammern, notwendig]
      - [t8-binom-faktorisieren, notwendig]
      - [t8-bruchterm-multiplizieren, hilfreich]
    status: geprueft

  # --- Gleichungen ---------------------------------------------------------

  t8-gleichung-klammern:
    titel: "Lineare Gleichungen mit Klammern lösen"
    beschreibung: "Erst Klammern auflösen, dann umformen (Typ −3·(x + 0,2) = x + 1,8; 3 − (x + 4) = 5x)."
    klasse: 8
    quelle: [lp-gy-2021 S. 20 (Kl. 8, LB 1), ih-terme-gleichungen S. 5]
    afb: [I, II]
    ohne_hm: true
    darstellungen: [symbolisch]
    fehlertypen: [UM, KL, VZ, ZF]
    voraussetzungen: [[v7-gleichung-linear, notwendig], [t8-ausmultiplizieren-monom, notwendig]]
    status: geprueft

  t8-gleichung-brueche:
    titel: "Lineare Gleichungen mit Brüchen lösen"
    beschreibung: "Bruchzahlen als Koeffizienten, z. B. durch Multiplizieren mit dem Hauptnenner (Typ 0 = −½x + 3/5)."
    klasse: 8
    quelle: [ih-terme-gleichungen S. 4–5]
    afb: [I, II, III]
    ohne_hm: true
    darstellungen: [symbolisch]
    fehlertypen: [UM, BR, VZ]
    voraussetzungen: [[v7-gleichung-linear, notwendig], [v6-bruch-addieren, notwendig], [v6-bruch-multiplizieren, notwendig]]
    status: geprueft

  t8-gleichung-summe-mal-summe:
    titel: "Gleichungen mit Summe mal Summe (x² fällt weg)"
    beschreibung: "Ausmultiplizieren, x²-Glieder heben sich auf, Rest linear (Typ (3x − 2)·(x + 5) − 3x² = 7)."
    klasse: 8
    quelle: [lp-gy-2021 S. 20 (Kl. 8, LB 1), ih-terme-gleichungen S. 5]
    afb: [II]
    ohne_hm: true
    darstellungen: [symbolisch]
    fehlertypen: [KL, UM, VZ, PO]
    voraussetzungen: [[t8-summe-mal-summe, notwendig], [t8-gleichung-klammern, notwendig]]
    status: geprueft

  t8-gleichung-sonderfaelle:
    titel: "Keine Lösung oder unendlich viele Lösungen"
    beschreibung: "Erkennen und korrekt notieren: L = { } (auch ∅) bzw. L = ℚ."
    klasse: 8
    quelle: [lp-gy-2021 S. 20 (Kl. 8, LB 1)]
    afb: [II, III]
    ohne_hm: true
    darstellungen: [symbolisch]
    fehlertypen: [UM]
    voraussetzungen: [[t8-gleichung-klammern, notwendig]]
    status: geprueft

  t8-gleichung-aufstellen:
    titel: "Gleichungen aus Sachaufgaben aufstellen und lösen"
    beschreibung: "Zahlenrätsel, Geometrie- und Alltagssituationen: Variable festlegen, Gleichung aufstellen, lösen, Antwort."
    klasse: 8
    quelle: [lp-gy-2021 S. 20 (Kl. 8, LB 1; Ziele Kl. 8 „Mathematisieren“)]
    afb: [II, III]
    ohne_hm: false
    darstellungen: [text]
    fehlertypen: [TV, UM, EH]
    voraussetzungen: [[t8-term-text, notwendig], [t8-gleichung-klammern, notwendig]]
    status: geprueft

  t8-nullprodukt:
    titel: "Produktgleichungen lösen (Produkt = 0)"
    beschreibung: "Satz vom Nullprodukt: Term1 · Term2 = 0 (Typ (2x + 4)·(3x − 1) = 0)."
    klasse: 8
    quelle: [ih-terme-gleichungen S. 5 („Gleichungen, die auf Term1 · Term2 = 0 führen“)]
    afb: [I, II]
    ohne_hm: true
    darstellungen: [symbolisch]
    fehlertypen: [UM, VZ]
    voraussetzungen: [[v7-gleichung-inhaltlich, notwendig], [v7-gleichung-linear, notwendig]]
    status: geprueft

  t8-gleichung-ausklammern-null:
    titel: "Gleichungen durch Ausklammern lösen"
    beschreibung: "Auf Produkt = 0 zurückführen (Typ x² − 3x = 0); typischer Fehler: durch x teilen und Lösung 0 verlieren."
    klasse: 8
    quelle: [ih-terme-gleichungen S. 5 (AB III)]
    afb: [III]
    ohne_hm: true
    darstellungen: [symbolisch]
    fehlertypen: [UM, KL]
    voraussetzungen: [[t8-nullprodukt, notwendig], [t8-ausklammern, notwendig]]
    status: geprueft

  t8-bruchgleichung:
    titel: "Einfache Bruchgleichungen lösen"
    beschreibung: >
      Variable im Nenner, Quadrate entfallen beim Umformen (Typ 5/(a − 1) = 3/a);
      Werte, für die ein Nenner null wird, müssen angegeben werden und zählen zur Bewertung.
    klasse: 8
    quelle: [lp-gy-2021 S. 20 (Kl. 8, LB 1, CAS-Beispiel), ih-terme-gleichungen S. 5 („einfache Bruchgleichungen“, AB III)]
    afb: [II, III]
    ohne_hm: true
    darstellungen: [symbolisch]
    fehlertypen: [UM, BR, KL]
    voraussetzungen: [[v7-gleichung-variable-im-nenner, notwendig], [t8-gleichung-klammern, notwendig]]
    status: geprueft

  t8-formel-umstellen:
    titel: "Formeln umstellen"
    beschreibung: "Auch mit Klammern und Brüchen (Typ u = 2·(a + b) nach b; R = ρ·l/A nach l; A = (a + c)/2 · h nach c)."
    klasse: 8
    quelle: [ih-terme-gleichungen S. 5 („Formeln umstellen“)]
    afb: [I, II, III]
    ohne_hm: true
    darstellungen: [symbolisch, text]
    fehlertypen: [UM, BR, KL]
    voraussetzungen: [[v7-formel-umstellen, notwendig], [t8-ausmultiplizieren-monom, hilfreich]]
    status: geprueft

  # --- Einblick / Kennen ---------------------------------------------------

  t8-ungleichung:
    titel: "Lineare Ungleichungen lösen (Einblick)"
    beschreibung: "Umformen wie bei Gleichungen; Relationszeichen umdrehen bei Multiplikation/Division mit negativer Zahl; Lösungsmenge am Zahlenstrahl."
    klasse: 8
    quelle: [lp-gy-2021 S. 20 (Kl. 8, LB 1, „Einblick gewinnen in das Lösen von Ungleichungen“)]
    afb: [I, II]
    ohne_hm: true
    darstellungen: [symbolisch, grafisch]
    fehlertypen: [UM, VZ]
    voraussetzungen: [[v7-gleichung-linear, notwendig]]
    status: geprueft

  t8-cas-ergebnisse:
    titel: "CAS-Ergebnisse lesen und prüfen"
    beschreibung: >
      Ausgaben eines CAS zu komplexeren Termen/Gleichungen deuten, mit eigener Rechnung oder
      Probe vergleichen, gleichwertige Darstellungen erkennen. Die Bedienung eines konkreten
      CAS übt die App nicht. Nie im hilfsmittelfreien Teil einer Probe-Arbeit.
    klasse: 8
    quelle: [lp-gy-2021 S. 20 (Kl. 8, LB 1, „Kennen der Verwendung von CAS …“)]
    afb: [I, II]
    ohne_hm: false
    darstellungen: [symbolisch]
    fehlertypen: [DA, UK]
    voraussetzungen: [[t8-term-gleichwertig, notwendig]]
    status: geprueft
